targets:
  $default:
    builders:
      freezed:
        enabled: true
        options:
          # Generate JSON serialization methods
          json_serializable: true
      json_serializable:
        enabled: true
        options:
          explicit_to_json: true
          create_factory: true
          create_to_json: true
          # Generate methods with _$$ prefix for freezed
          generic_argument_factories: true
